# Release pipeline for the public noviewlog repo (nostalgie/noviewlog).
# Triggered by v* tags pushed by scripts/publish-release.*; builds the
# fat-LTO publish binary for Windows (static CRT, like
# scripts/publish-slint-windows.ps1) and Linux, then attaches the archives
# to the GitHub release. Release notes come from the publish script
# (--notes-file); this workflow never generates or edits notes.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win-x64
            archive: NoViewLog-win-x64.zip
          - os: ubuntu-latest
            name: linux-x64
            archive: NoViewLog-linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Same dependency the local Linux helper installs
      # (scripts/setup-slint-deps.sh downloads libfontconfig-dev).
      - name: Install Linux deps (fontconfig for Slint)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev \
            || sudo apt-get install -y libfontconfig1-dev

      # Publish-only static CRT (self-contained exe, no VC Redist).
      # Never use this flag for release-dev builds.
      - name: Build (Windows, static CRT)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p noviewlog-slint

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release -p noviewlog-slint

      # Product naming: the archives ship NoViewLog.exe / noviewlog, not the
      # internal noviewlog-slint crate binary name.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item target\release\noviewlog-slint.exe NoViewLog.exe
          Compress-Archive -Path NoViewLog.exe -DestinationPath ${{ matrix.archive }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp target/release/noviewlog-slint noviewlog
          tar -czf ${{ matrix.archive }} noviewlog

      # The release itself (with curated notes) is created by the publish
      # script right after the tag push. Fall back to a bare release only so
      # the artifact is never lost; never auto-generate notes.
      - name: Attach artifact to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.archive }}" --repo "$GITHUB_REPOSITORY" --clobber
