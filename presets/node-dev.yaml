defaultFormat: node-default
defaultPreset: node-dev

formats: {}

presets:
  node-dev:
    filters:
      - id: hide-deprecation
        type: exclude
        pattern: '(node:.*DeprecationWarning|DEP0\d+)'
        enabled: true
      - id: only-errors
        type: include
        pattern: '(Error|ERROR|Exception)'
        enabled: false
